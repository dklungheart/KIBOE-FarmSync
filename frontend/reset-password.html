<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>KIBOE FarmSync - Reset Password</title>  <meta name="description" content="Reset your KIBOE FarmSync account password.">  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C2W5HDQJ5H"></script>  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-C2W5HDQJ5H');</script>  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">  <link href="assets/css/style.css" rel="stylesheet">  <link href="assets/css/auth.css" rel="stylesheet"></head><body>  <div class="auth-wrapper">    <div class="auth-card">      <div class="auth-header">        <a href="index.html" class="auth-logo">          <img src="assets/images/logo.png" alt="KIBOE FarmSync" height="18">        </a>        <h2>Set New Password</h2>        <p>Enter your new password below</p>      </div>      <form class="auth-form" id="resetForm">        <div class="form-group">          <label>New Password</label>          <div class="input-group">            <span class="input-group-text"><i class="fas fa-lock"></i></span>            <input type="password" class="form-control" id="newPw" placeholder="At least 6 characters" required minlength="6">          </div>        </div>        <div class="form-group">          <label>Confirm Password</label>          <div class="input-group">            <span class="input-group-text"><i class="fas fa-check-circle"></i></span>            <input type="password" class="form-control" id="confirmPw" placeholder="Repeat your password" required minlength="6">          </div>        </div>        <button type="submit" class="btn-glow auth-btn w-100"><span>Reset Password</span></button>      </form>      <div id="resetStatus" style="display:none;font-size:0.85rem;text-align:center;margin-top:12px;"></div>      <p class="auth-footer-text">Remember your password? <a href="login.html">Sign In</a></p>    </div>  </div>  <script>    const API_URL = 'http://localhost:5000';    const params = new URLSearchParams(window.location.search);    const token = params.get('token') || localStorage.getItem('reset_token');    async function apiRequest(method, path, body) {      const h = { 'Content-Type': 'application/json' };      const t = localStorage.getItem('kiboe_token');      if (t) h['Authorization'] = 'Bearer ' + t;      const o = { method, headers: h };      if (body) o.body = JSON.stringify(body);      const r = await fetch(API_URL + path, o);      const d = await r.json();      if (!r.ok) throw new Error(d.message);      return d;    }    document.getElementById('resetForm').addEventListener('submit', async function(e) {      e.preventDefault();      const pw = document.getElementById('newPw').value;      const confirm = document.getElementById('confirmPw').value;      const status = document.getElementById('resetStatus');      const btn = this.querySelector('button[type="submit"]');      if (pw !== confirm) { status.textContent = 'Passwords do not match'; status.style.color = '#ff4757'; status.style.display = 'block'; return; }      if (pw.length < 6) { status.textContent = 'Password must be at least 6 characters'; status.style.color = '#ff4757'; status.style.display = 'block'; return; }      if (!token) { status.textContent = 'Invalid or missing reset token'; status.style.color = '#ff4757'; status.style.display = 'block'; return; }      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Resetting...</span>';      status.style.display = 'none';      try {        await apiRequest('POST', '/api/auth/reset', { token, new_password: pw });        status.textContent = 'Password reset successful! Redirecting to login...';        status.style.color = '#7BC300';        status.style.display = 'block';        localStorage.removeItem('reset_token');        setTimeout(() => window.location.href = 'login.html', 2000);      } catch (err) {        btn.innerHTML = '<span>Reset Password</span>';        status.textContent = err.message || 'Reset failed';        status.style.color = '#ff4757';        status.style.display = 'block';      }    });  </script></body></html>
