<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIBOE FarmSync - Register</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C2W5HDQJ5H"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-C2W5HDQJ5H');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <a href="index.html" class="auth-back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <img src="assets/images/logo.png" alt="KIBOE FarmSync" height="42">
        </a>
        <h2>Create Account</h2>
        <p>Start your smart farming journey today</p>
      </div>
      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control" placeholder="John Doe" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input type="email" class="form-control" placeholder="you@example.com" required>
          </div>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-phone"></i></span>
            <input type="tel" class="form-control" placeholder="+254 700 000 000" required>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" placeholder="Create a strong password" required>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-check-circle"></i></span>
            <input type="password" class="form-control" placeholder="Confirm your password" required>
          </div>
        </div>
        <div class="form-group">
          <label>Farm Type</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-tractor"></i></span>
            <select class="form-control">
              <option>Crops Only</option>
              <option>Livestock Only</option>
              <option>Mixed Farming</option>
              <option>Poultry</option>
              <option>Aquaculture</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="agreeTerms" required>
          <label class="form-check-label" for="agreeTerms">I agree to the <a href="#">Terms &amp; Conditions</a></label>
        </div>
        <div id="regStatus" style="display:none;font-size:0.82rem;text-align:center;margin-bottom:12px;"></div>
        <button type="submit" class="btn-glow auth-btn w-100"><span>Create Account</span></button>
      </form>
      <p class="auth-footer-text">Already have an account? <a href="login.html">Sign In</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = 'http://localhost:5000';
    const API = {
      getToken() { return localStorage.getItem('kiboe_token'); },
      isAuthenticated() { return !!this.getToken(); },
      async request(method, path, body) {
        const h = { 'Content-Type': 'application/json' };
        const t = this.getToken();
        if (t) h['Authorization'] = 'Bearer ' + t;
        const o = { method, headers: h };
        if (body) o.body = JSON.stringify(body);
        const r = await fetch(API_URL + path, o);
        const d = await r.json();
        if (!r.ok) throw new Error(d.message);
        return d;
      },
      register(u) { return this.request('POST', '/api/auth/register', u); },
      login(c) { return this.request('POST', '/api/auth/login', c); },
      getProfile() { return this.request('GET', '/api/auth/profile'); },
      getCrops(p) { const q = new URLSearchParams(p); return this.request('GET', '/api/crops?' + q); },
      getLivestock(p) { const q = new URLSearchParams(p); return this.request('GET', '/api/livestock?' + q); },
      getTransactions(p) { const q = new URLSearchParams(p); return this.request('GET', '/api/transactions?' + q); },
      getTransactionSummary(p) { const q = new URLSearchParams(p); return this.request('GET', '/api/transactions/summary?' + q); },
      createTransaction(d) { return this.request('POST', '/api/transactions', d); },
      sendContact(m) { return this.request('POST', '/api/contact', m); }
    };

    if (API.isAuthenticated()) { window.location.href = 'dashboard.html'; }

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const inputs = this.querySelectorAll('input');
      const full_name = inputs[0].value;
      const email = inputs[1].value;
      const phone = inputs[2].value;
      const password = inputs[3].value;
      const confirm = inputs[4].value;
      const farm_type = this.querySelector('select').value.toLowerCase().replace(/ /g, '_');
      const status = document.getElementById('regStatus');

      if (password.length < 6) { showStatus(status, 'Password must be at least 6 characters.', 'error'); return; }
      if (password !== confirm) { showStatus(status, 'Passwords do not match.', 'error'); return; }

      const btn = this.querySelector('button[type="submit"]');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Creating account...</span>';
      showStatus(status, '', '');
      try {
        const res = await API.register({ full_name, email, phone, password, farm_type });
        localStorage.setItem('kiboe_token', res.data.token);
        window.location.href = 'dashboard.html';
      } catch (err) {
        btn.innerHTML = '<span>Create Account</span>';
        showStatus(status, err.message || 'Registration failed', 'error');
      }
    });

    function showStatus(el, msg, type) {
      el.style.display = 'block';
      el.textContent = msg;
      el.style.color = type === 'error' ? '#E0454F' : type === 'success' ? '#1D7A42' : 'var(--muted)';
    }
  </script>
</body>
</html>
